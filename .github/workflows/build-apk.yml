name: Build APK

on:
  push:
    branches: [main]
  # Build the branch too, so a red change cannot reach main unnoticed. Run 7 went red on
  # main precisely because nothing tested the branch first.
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to main makes an in-flight build redundant.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

# Creating a release needs write access to repository contents.
permissions:
  contents: write

jobs:
  build:
    name: Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The wrapper jar is a binary in the repo; this checks it against Gradle's
      # published checksums before it is executed.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      # No setup-android step: the ubuntu runner image already ships the Android SDK
      # with ANDROID_HOME set and the licences accepted, and Gradle downloads any
      # missing platform or build-tools itself. android-actions/setup-android still
      # installs the long-obsolete `tools` package, which sdkmanager now fails on.

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.run_number }}-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Kept on failure so a red build can be diagnosed without re-running it locally.
      # Releases do not expire, unlike the 30-day run artifact, so this is the durable
      # download point. Uses the preinstalled gh CLI rather than a third-party action.
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Everything from the event goes through the environment rather than being
          # interpolated into the script: a commit message is attacker-controllable text,
          # and splicing it into shell source would let it run as code.
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'Manual run' }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          version="$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo '1.0')"
          tag="v${version}-build.${RUN_NUMBER}"
          apk="4hb-companion-${version}-build${RUN_NUMBER}-debug.apk"

          cp app/build/outputs/apk/debug/app-debug.apk "$apk"

          # Shell parameter expansion inserts these values literally; it does not re-parse
          # them, so the heredoc is safe even though the delimiter is unquoted.
          notes="$(cat <<EOF
          Debug build, signed with the standard debug keystore — download the APK below and
          sideload it.

          Commit: ${COMMIT_SHA}

          ${COMMIT_MESSAGE}

          [Build log](${RUN_URL})
          EOF
          )"

          # A re-run reuses its run number, so add the APK to the existing release rather
          # than failing on a duplicate tag.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" \
              --title "${version} (build ${RUN_NUMBER})" \
              --notes "$notes" \
              --target "$COMMIT_SHA"
          fi

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.run_number }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
